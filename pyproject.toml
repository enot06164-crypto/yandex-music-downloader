[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-music-downloader"
version = "0.1.1"
description = "Download music from Yandex Music with PyQt5 GUI, token encryption and metadata embedding"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "yandex-music>=2.1.1",
    "PyQt5>=5.15.9",
    "cryptography>=41.0.0",
    "mutagen>=1.47.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/enot06164-crypto/yandex-music-downloader"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]
